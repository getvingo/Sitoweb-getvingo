{% extends "base.html" %}
{% from "_macro.html" import i, indietro %}
{% block contenuto %}
<div class="titolo-pagina"><div>{{ indietro(torna) }}<h1>{{ u.nome }}</h1></div></div>
<form method="post" class="scheda" data-una-volta>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="griglia-2">
    <label class="campo"><span>Nome e cognome</span><input name="nome" value="{{ u.nome }}" required></label>
    <label class="campo"><span>Email</span><input type="email" name="email" value="{{ u.email }}" required></label>
    {% if u.ruolo == 'fornitore' %}
    <label class="campo"><span>Azienda (gruppo)</span><select name="sede_id">{% for s in fornitori %}<option value="{{ s.id }}" {{ 'selected' if s.id == u.sede_id }}>{{ s.nome }}</option>{% endfor %}</select></label>
    {% elif u.id != g.utente.id %}
    <label class="campo"><span>Ruolo</span><select name="ruolo">{% for k, n in ruoli.items() %}<option value="{{ k }}" {{ 'selected' if k == u.ruolo }}>{{ n }}</option>{% endfor %}</select></label>
    {% endif %}
    <label class="campo"><span>Nuova password <span class="tenue">(lascia vuoto per non cambiarla)</span></span><input type="password" name="password" minlength="8" autocomplete="new-password"></label>
  </div>
  {% if u.id != g.utente.id %}
  <label class="spunta"><input type="checkbox" name="attivo" value="1" {{ 'checked' if u.attivo }}><span><b>Account attivo</b>: togli la spunta per bloccare l'accesso senza perdere lo storico.</span></label>
  {% endif %}
  <button class="btn primario pieno">Salva</button>
</form>
{% endblock %}
